# Single source of truth for every dependency version in FOLD.
# Pinned deliberately: this app ships no analytics and no telemetry, so the
# dependency surface is kept small and auditable.

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coroutines = "1.9.0"
serialization = "1.7.3"

coreKtx = "1.15.0"
appcompat = "1.7.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
navigation = "2.8.5"
documentfile = "1.0.1"
biometric = "1.1.0"
datastore = "1.1.1"
room = "2.6.1"
work = "2.10.0"
glance = "1.1.1"
hilt = "2.52"
hiltAndroidx = "1.2.0"
ktor = "2.3.12"

junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestCore = "1.6.1"
robolectric = "4.13"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
